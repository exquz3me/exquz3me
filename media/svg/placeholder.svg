<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <style>
    :root { --background: #eee; --grid: #dfdfdf; --cross: #c9c9c9; --rear: #aaa; --front: #777; --plus: #222; }
    @media (prefers-color-scheme: dark) {
      :root { --background: #111; --grid: #202020; --cross: #363636; --rear: #555; --front: #888; --plus: #ddd; }
    }
  </style>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" stroke="var(--grid)"/>
