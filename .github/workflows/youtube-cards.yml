# --------------------------------------------------
# YouTube Cards workflow.
#
# Updates the README YouTube cards monthly or on manual dispatch.
# Uses job-scoped write permissions to commit generated card updates.
# The pinned upstream composite action performs checkout and commits itself.
#
# For more information please see:
# https://docs.github.com/en/actions/writing-workflows
# --------------------------------------------------

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: YouTube Cards

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Deny all by default, jobs declare their own permissions as needed
permissions: {}

jobs:
  # --------------------------------------------------
  # Update cards - Update YouTube cards in README
  # --------------------------------------------------
  update-cards:
    name: Update YouTube cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update YouTube cards
        uses: DenverCoder1/github-readme-youtube-cards@e38b64eaaf0317b4eff0a0a92334531259e465ae
        with:
          channel_id: "UCM217JhNPpu5J4iMsc8WD1g"
          playlist_id: "PL_y8zv_VZkddeuSuJgQo7m6cGYVBXBgFL"
          max_videos: 6
          commit_message: "docs: update YouTube cards"
          theme_context_light:
            '{ "background_color": "#ffffff", "title_color": "#24292f",
            "stats_color": "#57606a" }'
          theme_context_dark:
            '{ "background_color": "#0d1117", "title_color": "#ffffff",
            "stats_color": "#dedede" }'
